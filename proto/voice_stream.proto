syntax = "proto3";

package voice_stream;

// Service definition for voice streaming
service VoiceStreamer {
  // Bidirectional stream for voice data
  rpc StreamVoice(stream VoiceChunk) returns (stream VoiceAck);
}

// Message containing a chunk of voice data (now features)
message VoiceChunk {
  int64 sequence_id = 1; // Sequence number for ordering
  int64 timestamp_ms = 2; // Timestamp when the chunk was captured/processed
  bytes hubert_tokens = 3; // Serialized list/array of HuBERT token IDs
  bytes speaker_embedding = 4; // Serialized speaker embedding vector
}

// Acknowledgement message
message VoiceAck {
  int64 sequence_id = 1; // Acknowledge sequence number
  string status = 2;     // Status message (e.g., "OK", "Received")
} 